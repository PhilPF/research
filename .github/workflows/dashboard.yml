name: Build MAGI dashboard

# Rebuilds and republishes the dashboard whenever any session branch
# commits new state. READS state; WRITES only the published Pages site.
on:
  push:
    branches: ['**']
    paths:
      - 'state/**'
      - 'reviews/**'
      - 'LOG.md'
      - 'docs/**'
      - 'scripts/collect_state.py'
      - '.github/workflows/dashboard.yml'
  workflow_dispatch:

permissions:
  contents: read      # never write to state/, reviews/, LOG.md
  pages: write
  id-token: write

# Coalesce bursts of commits into a single build.
concurrency:
  group: magi-dashboard
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (all branches)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assemble site
        run: |
          set -e
          mkdir -p _site
          cp -r docs/. _site/
          mkdir -p _site/data
          python3 scripts/collect_state.py --out _site/data
          echo "--- generated ---"
          ls -la _site/data

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
