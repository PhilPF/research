name: Build MAGI dashboard

# Rebuilds and republishes the dashboard whenever any session branch
# commits new state. READS state; WRITES only the published Pages site.
#
# IMPORTANT — deterministic inputs:
# A push to a session branch triggers this workflow, but the site source
# and the collector script are ALWAYS taken from the default branch, never
# from the branch that happened to trigger the run. Otherwise a session
# branch that forked before the latest dashboard fixes would republish its
# own stale docs/ and run its own stale scripts/.
on:
  push:
    branches: ['**']
    paths:
      - 'state/**'
      - 'reviews/**'
      - 'LOG.md'
      - 'docs/**'
      - 'scripts/collect_state.py'
      - '.github/workflows/dashboard.yml'
  workflow_dispatch:
  # No schedule. Builds happen only when state is actually pushed.
  #
  # Caveat: a push triggers the workflow file that exists ON THE PUSHED
  # BRANCH. Any session branch created after this file landed on the
  # default branch inherits it and triggers normally. A branch created
  # BEFORE it cannot trigger anything — for those, run this workflow
  # once manually (Actions -> Run workflow), which collects state from
  # every branch regardless of which one triggered it.

permissions:
  contents: read      # never write to state/, reviews/, LOG.md
  pages: write
  id-token: write

concurrency:
  group: magi-dashboard
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.gate.outputs.changed }}
    steps:
      # Checkout the DEFAULT branch, not the triggering ref.
      # fetch-depth: 0 still brings every branch's history, which is what
      # collect_state.py walks to find sessions.
      - name: Checkout default branch (all history)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Report build inputs
        run: |
          echo "triggered by : ${{ github.ref_name }} (${{ github.event_name }})"
          echo "building from: ${{ github.event.repository.default_branch }}"
          echo "site commit  : $(git rev-parse --short HEAD)"

      - name: Sanity-check the collector
        run: |
          set -e
          test -f scripts/collect_state.py || { echo "::error::scripts/collect_state.py missing on default branch"; exit 1; }
          head -1 scripts/collect_state.py | grep -q 'python3' \
            || { echo "::error::collect_state.py does not look like a Python script — is it a corrupted copy?"; exit 1; }
          test -f docs/index.html || { echo "::error::docs/index.html missing on default branch"; exit 1; }

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Assemble site
        run: |
          set -e
          mkdir -p _site
          cp -r docs/. _site/
          mkdir -p _site/data
          # Last stdout line is the content fingerprint.
          HASH=$(python3 scripts/collect_state.py --out _site/data | tail -n 1)
          echo "NEW_HASH=$HASH" >> "$GITHUB_ENV"
          echo "--- generated ---"
          ls -la _site/data
          test -s _site/data/index.json || { echo "::error::index.json was not produced"; exit 1; }

      - name: Decide whether to deploy
        id: gate
        run: |
          set -e
          BASE="${{ steps.pages.outputs.base_url }}"
          OLD=""
          if [ -n "$BASE" ]; then
            OLD=$(curl -fsSL --max-time 20 "$BASE/data/build-id.json" 2>/dev/null \
                  | python3 -c "import sys,json;print(json.load(sys.stdin).get('content_hash',''))" 2>/dev/null || echo "")
          fi
          echo "published: '${OLD:-<none>}'"
          echo "collected: '$NEW_HASH'"
          if [ -n "$OLD" ] && [ "$OLD" = "$NEW_HASH" ]; then
            echo "State unchanged — skipping deploy."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Manual runs always publish, so the button is never a no-op.
      - name: Force deploy on manual run
        if: github.event_name == 'workflow_dispatch'
        run: echo "changed=true" >> "$GITHUB_OUTPUT"
        id: force

      - name: Upload artifact
        if: steps.gate.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    if: needs.build.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
